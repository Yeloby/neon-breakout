name: Linux-pakker

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Installer RPM-verktøy
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Kjør tester
        run: npm test

      - name: Bygg Linux-pakker
        run: npm run build:linux

      - name: Last opp byggeartefakter
        uses: actions/upload-artifact@v4
        with:
          name: neon-breakout-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/latest-linux.yml
          if-no-files-found: error

      - name: Publiser versjonert utgivelse
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.AppImage
          dist/*.deb
          dist/*.rpm
          dist/*.tar.gz
          --generate-notes
          --title "Neon Breakout ${GITHUB_REF_NAME}"
