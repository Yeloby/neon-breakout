name: Linux-pakker

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_repository:
        description: "Publiser det signerte APT- og Flatpak-arkivet"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Installer RPM-verktøy
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Kjør tester
        run: npm test

      - name: Bygg Linux-pakker
        run: npm run build:linux

      - name: Installer Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Bygg Snap-pakke
        run: snapcraft pack --destructive-mode

      - name: Installer Flatpak-verktøy
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Bygg Flatpak-pakke
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/io.github.Yeloby.NeonBreakout.yml
          flatpak build-bundle flatpak-repo dist/Neon-Breakout-${GITHUB_REF_NAME#v}.flatpak io.github.Yeloby.NeonBreakout

      - name: Last opp byggeartefakter
        uses: actions/upload-artifact@v4
        with:
          name: neon-breakout-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.flatpak
            dist/latest-linux.yml
            ./*.snap
            flatpak-repo/**
          if-no-files-found: error

      - name: Publiser versjonert utgivelse
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/*.AppImage dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.flatpak \
              ./*.snap \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.AppImage dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.flatpak \
              ./*.snap \
              --generate-notes \
              --title "Neon Breakout ${GITHUB_REF_NAME}"
          fi

      - name: Publiser til Snap Store
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS}" ]; then
            echo "::warning::SNAPCRAFT_STORE_CREDENTIALS mangler; Snap-pakken ligger fortsatt i GitHub-utgivelsen."
            exit 0
          fi
          snapcraft upload --release=stable ./*.snap

  publish-apt:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_repository)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Hent Linux-pakkene
        uses: actions/download-artifact@v4
        with:
          name: neon-breakout-linux-${{ github.sha }}
          path: .

      - name: Installer arkivverktøy
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev flatpak gnupg

      - name: Bygg signert Yeloby APT-arkiv
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY}" ] || [ -z "${APT_GPG_PASSPHRASE}" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY og APT_GPG_PASSPHRASE må ligge som GitHub Actions-secrets."
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP}/yeloby-gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --import <<<"${APT_GPG_PRIVATE_KEY}"
          APT_SIGNING_KEY="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"

          mkdir -p \
            site/apt/dists/stable/main/binary-amd64 \
            site/apt/pool/main/n/neon-breakout \
            site/apt/pool/main/y/yeloby-archive-keyring
          cp dist/*.deb site/apt/pool/main/n/neon-breakout/
          gpg --batch --yes --export "${APT_SIGNING_KEY}" > site/apt/yeloby-archive-keyring.gpg

          mkdir -p keyring-package/DEBIAN keyring-package/usr/share/keyrings keyring-package/etc/apt/sources.list.d
          cp site/apt/yeloby-archive-keyring.gpg keyring-package/usr/share/keyrings/yeloby-archive-keyring.gpg
          cp packaging/apt/yeloby.sources keyring-package/etc/apt/sources.list.d/yeloby.sources
          cp packaging/apt/keyring-control keyring-package/DEBIAN/control
          dpkg-deb --root-owner-group --build keyring-package site/apt/yeloby-archive-keyring.deb
          cp site/apt/yeloby-archive-keyring.deb site/apt/pool/main/y/yeloby-archive-keyring/

          cd site/apt
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9 -k -f dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Yeloby" \
            -o APT::FTPArchive::Release::Label="Yeloby Games" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Relaxing games for everyone" \
            release dists/stable > dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE}" \
            --local-user "${APT_SIGNING_KEY}" \
            --clearsign --output dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE}" \
            --local-user "${APT_SIGNING_KEY}" \
            --detach-sign --armor --output dists/stable/Release.gpg dists/stable/Release

          cd "${GITHUB_WORKSPACE}"
          cp -a flatpak-repo site/flatpak
          flatpak build-update-repo \
            --gpg-sign="${APT_SIGNING_KEY}" \
            --gpg-homedir="${GNUPGHOME}" \
            site/flatpak
          YELOBY_GPG_KEY="$(base64 -w 0 site/apt/yeloby-archive-keyring.gpg)"
          printf '%s\n' \
            '[Flatpak Repo]' \
            'Title=Yeloby Games' \
            'Comment=Relaxing games for everyone' \
            'Description=Yeloby games with neon, imagination and emoji magic' \
            'Url=https://yeloby.github.io/neon-breakout/flatpak/' \
            'Homepage=https://github.com/Yeloby' \
            "GPGKey=${YELOBY_GPG_KEY}" \
            > site/flatpak/yeloby.flatpakrepo
          printf '%s\n' \
            '[Flatpak Ref]' \
            'Name=io.github.Yeloby.NeonBreakout' \
            'Branch=master' \
            'Title=Neon Breakout' \
            'Comment=A colorful and relaxing Breakout game by Yeloby' \
            'Url=https://yeloby.github.io/neon-breakout/flatpak/' \
            'RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo' \
            'IsRuntime=false' \
            "GPGKey=${YELOBY_GPG_KEY}" \
            > site/flatpak/neon-breakout.flatpakref

      - name: Klargjør GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp Yeloby APT-side
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publiser Yeloby APT-arkiv
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
