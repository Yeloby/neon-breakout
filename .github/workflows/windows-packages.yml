name: Windows-pakker

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Kjør tester
        run: npm test

      - name: Bygg Windows-installer og portabel utgave
        run: npm run build:windows

      - name: Bygg Microsoft Store-pakke
        run: npm run build:windows-store

      - name: Last opp Windows-artefakter
        uses: actions/upload-artifact@v4
        with:
          name: neon-breakout-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.appx
          if-no-files-found: error

      - name: Legg Windows-pakkene til GitHub-utgivelsen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/*.exe --clobber
          gh release upload "${GITHUB_REF_NAME}" dist/*.appx --clobber
