app-id: io.github.Yeloby.NeonBreakout
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: neon-breakout

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: neon-breakout
    buildsystem: simple
    build-commands:
      - install -Dm755 neon-breakout /app/lib/neon-breakout/neon-breakout
      - cp -a locales resources chrome-sandbox chrome_100_percent.pak chrome_200_percent.pak icudtl.dat libEGL.so libGLESv2.so libffmpeg.so libvk_swiftshader.so libvulkan.so.1 resources.pak snapshot_blob.bin v8_context_snapshot.bin vk_swiftshader_icd.json /app/lib/neon-breakout/
      - install -Dm755 neon-breakout-wrapper /app/bin/neon-breakout
      - install -Dm644 io.github.Yeloby.NeonBreakout.desktop /app/share/applications/io.github.Yeloby.NeonBreakout.desktop
      - install -Dm644 io.github.Yeloby.NeonBreakout.metainfo.xml /app/share/metainfo/io.github.Yeloby.NeonBreakout.metainfo.xml
    sources:
      - type: dir
        path: ../../dist/linux-unpacked
      - type: file
        path: neon-breakout-wrapper
      - type: file
        path: io.github.Yeloby.NeonBreakout.desktop
      - type: file
        path: io.github.Yeloby.NeonBreakout.metainfo.xml
