name: neon-breakout
base: core24
version: '1.5.4'
summary: A colorful and relaxing Breakout game by Yeloby
description: |
  Neon Breakout is a relaxing arcade game with neon visuals, creative emoji
  power-ups, varied levels and three difficulty modes.
license: GPL-3.0-or-later
grade: stable
icon: snap/gui/icon.png
confinement: strict

plugs:
  shared-memory:
    private: true

apps:
  neon-breakout:
    command: neon-breakout --no-sandbox
    extensions:
      - gnome
    plugs:
      - audio-playback
      - opengl
      - shared-memory
      - screen-inhibit-control

parts:
  neon-breakout:
    plugin: dump
    source: dist/linux-unpacked
    stage-packages:
      - libnss3
      - libasound2t64
      - libxss1
